<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Engine Interface</title>
    <style>
        /* ============================================
           Global Styles
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ============================================
           Main Container
           ============================================ */
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }

        /* ============================================
           Chessboard Styles
           ============================================ */
        .board-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .board-container {
            position: relative;
            display: inline-block;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 3px solid #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-left: 20px;
            margin-top: 0;
        }

        /* Coordinate labels */
        .rank-labels {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            height: 560px; /* 8 * 70px */
            justify-content: space-around;
            align-items: center;
            width: 20px;
        }

        .rank-label {
            font-size: 13px;
            font-weight: bold;
            color: #769656;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-labels {
            position: absolute;
            left: 20px;
            bottom: -25px;
            display: flex;
            width: 560px; /* 8 * 70px */
            justify-content: space-around;
        }

        .file-label {
            font-size: 13px;
            font-weight: bold;
            color: #769656;
            width: 70px;
            text-align: center;
        }

        .square {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            cursor: pointer;
            transition: background-color 0.2s;
            user-select: none;
        }

        .square.light {
            background-color: #f0d9b5;
        }

        .square.dark {
            background-color: #b58863;
        }

        .square:hover {
            opacity: 0.8;
        }

        .square.selected {
            box-shadow: inset 0 0 0 4px #ffd700;
            position: relative;
        }

        .square.selected::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 215, 0, 0.3);
            pointer-events: none;
        }

        .square.legal-destination {
            position: relative;
        }

        .square.legal-destination::before {
            content: '';
            position: absolute;
            width: 25%;
            height: 25%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(34, 139, 34, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        .square.legal-destination.has-piece::before {
            width: 100%;
            height: 100%;
            background: rgba(220, 20, 60, 0.3);
            border-radius: 0;
            border: 3px solid rgba(220, 20, 60, 0.7);
        }

        /* ============================================
           Control Panel Styles
           ============================================ */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        label {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        select {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover {
            border-color: #764ba2;
        }

        select:focus {
            outline: none;
            border-color: #764ba2;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================
           Information Display Styles
           ============================================ */
        .info-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .info-row {
            margin-bottom: 15px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            padding: 8px;
            background: white;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        /* ============================================
           Status Messages
           ============================================ */
        .status-message {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.thinking {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        /* ============================================
           Engine Status Display
           ============================================ */
        .engine-status {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .engine-status.idle {
            background: #e9ecef;
            color: #6c757d;
            border: 2px solid #ced4da;
        }

        .engine-status.thinking {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #17a2b8;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        /* ============================================
           Promotion Modal Styles
           ============================================ */
        .promotion-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .promotion-dialog {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .promotion-dialog h3 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        .promotion-pieces {
            display: flex;
            gap: 15px;
        }

        .promotion-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 80px;
        }

        .promotion-option:hover {
            border-color: #4CAF50;
            background-color: #f0f0f0;
            transform: scale(1.05);
        }

        .promotion-piece-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .promotion-option span:last-child {
            font-size: 14px;
            color: #666;
        }

        /* ============================================
           Game Over Modal Styles
           ============================================ */
        .game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .game-over-dialog {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
            min-width: 300px;
        }

        .game-over-dialog h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 32px;
            color: #333;
        }

        .game-over-dialog p {
            margin-bottom: 30px;
            font-size: 18px;
            color: #666;
        }

        .game-over-dialog button {
            padding: 15px 40px;
            font-size: 18px;
        }

        /* ============================================
           Learn Mode Styles
           ============================================ */
        .learn-mode-section {
            background: #f0f8ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .learn-mode-section.active {
            background: #e6f7ff;
            border-color: #28a745;
        }

        .learn-mode-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            justify-content: center;
        }

        #learnModeBtn {
            min-width: 150px;
        }

        #learnModeBtn.active {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .opening-selection {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        select:disabled {
            background: #e9ecef;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* ============================================
           Move Input Modal Styles
           ============================================ */
        .move-input-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1500;
        }

        .move-input-dialog {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            min-width: 350px;
        }

        .move-input-dialog h3 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
            font-size: 20px;
        }

        .move-input-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #moveInput {
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        #moveInput:focus {
            outline: none;
            border-color: #764ba2;
        }

        .move-input-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .move-input-buttons button {
            flex: 1;
        }

        .cancel-btn {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        /* ============================================
           Responsive Design
           ============================================ */
        @media (max-width: 600px) {
            .chessboard {
                grid-template-columns: repeat(8, 50px);
                grid-template-rows: repeat(8, 50px);
                margin-left: 18px;
            }

            .square {
                width: 50px;
                height: 50px;
                font-size: 36px;
            }

            h1 {
                font-size: 24px;
            }

            .container {
                padding: 20px;
            }

            .rank-labels {
                height: 400px; /* 8 * 50px */
                width: 18px;
            }

            .rank-label {
                height: 50px;
                font-size: 11px;
            }

            .file-labels {
                left: 18px;
                bottom: -22px;
                width: 400px; /* 8 * 50px */
            }

            .file-label {
                width: 50px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>♔ Chess Engine Interface ♔</h1>

        <!-- Engine Status Display -->
        <div id="engineStatus" class="engine-status idle">Engine idle</div>

        <!-- Status Messages -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Chessboard -->
        <div class="board-wrapper">
            <div class="board-container">
                <!-- Rank labels (8-1) -->
                <div class="rank-labels">
                    <div class="rank-label">8</div>
                    <div class="rank-label">7</div>
                    <div class="rank-label">6</div>
                    <div class="rank-label">5</div>
                    <div class="rank-label">4</div>
                    <div class="rank-label">3</div>
                    <div class="rank-label">2</div>
                    <div class="rank-label">1</div>
                </div>

                <!-- Chess board -->
                <div id="chessboard" class="chessboard"></div>

                <!-- File labels (a-h) -->
                <div class="file-labels">
                    <div class="file-label">a</div>
                    <div class="file-label">b</div>
                    <div class="file-label">c</div>
                    <div class="file-label">d</div>
                    <div class="file-label">e</div>
                    <div class="file-label">f</div>
                    <div class="file-label">g</div>
                    <div class="file-label">h</div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <!-- Learn Mode Section -->
            <div id="learnModeSection" class="learn-mode-section">
                <div class="learn-mode-header">
                    <button id="learnModeBtn">Learn Mode: OFF</button>
                </div>
                <div class="opening-selection">
                    <label for="openingSelect">Teaching:</label>
                    <select id="openingSelect" disabled>
                        <option value="caro_kann_classical">Caro-Kann Classical</option>
                    </select>
                </div>
            </div>

            <div class="control-row">
                <label for="engineColor">Engine plays:</label>
                <select id="engineColor">
                    <option value="white">White</option>
                    <option value="black">Black</option>
                </select>
            </div>
            <div class="control-row">
                <button id="getMoveBtn" onclick="getEngineMove()">Get Engine Move</button>
                <button onclick="resetBoard()">Reset Board</button>
            </div>
        </div>

        <!-- Information Panel -->
        <div class="info-panel">
            <div class="info-row">
                <div class="info-label">Last Move:</div>
                <div id="lastMove" class="info-value">None</div>
            </div>
            <div class="info-row">
                <div class="info-label">Current FEN:</div>
                <div id="fenString" class="info-value"></div>
            </div>
        </div>

        <!-- Promotion Modal -->
        <div id="promotionModal" class="promotion-modal" style="display: none;">
            <div class="promotion-dialog">
                <h3>Choose Promotion Piece</h3>
                <div class="promotion-pieces">
                    <div class="promotion-option" data-piece="q">
                        <span class="promotion-piece-icon" id="promotionQueen"></span>
                        <span>Queen</span>
                    </div>
                    <div class="promotion-option" data-piece="r">
                        <span class="promotion-piece-icon" id="promotionRook"></span>
                        <span>Rook</span>
                    </div>
                    <div class="promotion-option" data-piece="b">
                        <span class="promotion-piece-icon" id="promotionBishop"></span>
                        <span>Bishop</span>
                    </div>
                    <div class="promotion-option" data-piece="n">
                        <span class="promotion-piece-icon" id="promotionKnight"></span>
                        <span>Knight</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="gameOverModal" class="game-over-modal" style="display: none;">
            <div class="game-over-dialog">
                <h2 id="gameOverTitle"></h2>
                <p id="gameOverMessage"></p>
                <button onclick="restartGame()">Play Again</button>
            </div>
        </div>

        <!-- Move Input Modal (for Learn Mode) -->
        <div id="moveInputModal" class="move-input-modal" style="display: none;">
            <div class="move-input-dialog">
                <h3>What's the best move in this position?</h3>
                <div class="move-input-form">
                    <input type="text" id="moveInput" placeholder="e.g., c6, Nf3, O-O" autocomplete="off">
                    <div class="move-input-buttons">
                        <button id="teachMoveBtn">Teach Move</button>
                        <button id="cancelMoveBtn" class="cancel-btn">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // Chess Piece Symbols
        // ============================================
        const PIECES = {
            // White pieces
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            // Black pieces
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        // ============================================
        // Game State
        // ============================================
        let board = [];
        let whiteToMove = true;
        let lastMove = null;
        let selectedSquare = null; // {row, col} of selected piece
        let legalMovesForPiece = []; // List of legal moves for currently selected piece
        let cachedLegalMoves = null; // Cached legal moves for current position
        let isProcessing = false; // Prevent moves while engine is thinking
        let isGameOver = false; // Track if game has ended (checkmate or stalemate)
        let isLearnMode = false; // Track if Learn Mode is active

        // API endpoints
        const API_ENDPOINT = 'https://chessengine2.onrender.com/move';
        const LEGAL_MOVES_ENDPOINT = 'https://chessengine2.onrender.com/legal-moves';

        // ============================================
        // Initialize Board with Starting Position
        // ============================================
        function initializeBoard() {
            board = [
                ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Row 8 (Black back rank)
                ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // Row 7 (Black pawns)
                ['.', '.', '.', '.', '.', '.', '.', '.'], // Row 6
                ['.', '.', '.', '.', '.', '.', '.', '.'], // Row 5
                ['.', '.', '.', '.', '.', '.', '.', '.'], // Row 4
                ['.', '.', '.', '.', '.', '.', '.', '.'], // Row 3
                ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // Row 2 (White pawns)
                ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']  // Row 1 (White back rank)
            ];
            whiteToMove = true;
            lastMove = null;
            selectedSquare = null;
            legalMovesForPiece = [];
            cachedLegalMoves = null;
            isProcessing = false;
        }

        // ============================================
        // Render the Chessboard
        // ============================================
        function renderBoard() {
            const chessboard = document.getElementById('chessboard');
            chessboard.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square';
                    square.dataset.row = row;
                    square.dataset.col = col;

                    // Alternate light and dark squares
                    if ((row + col) % 2 === 0) {
                        square.classList.add('light');
                    } else {
                        square.classList.add('dark');
                    }

                    // Highlight selected square
                    if (selectedSquare && selectedSquare.row === row && selectedSquare.col === col) {
                        square.classList.add('selected');
                    }

                    // Highlight legal destination squares
                    const algebraicSquare = coordsToAlgebraic(row, col);
                    if (legalMovesForPiece.some(move => move.endsWith(algebraicSquare))) {
                        square.classList.add('legal-destination');
                        // Add different style if square has a piece (capture)
                        if (board[row][col] !== '.') {
                            square.classList.add('has-piece');
                        }
                    }

                    // Add piece symbol if present
                    const piece = board[row][col];
                    if (piece !== '.') {
                        square.textContent = PIECES[piece];
                    }

                    // Add click handler
                    square.addEventListener('click', () => handleSquareClick(row, col));

                    chessboard.appendChild(square);
                }
            }

            // Update FEN display
            updateFENDisplay();
        }

        // ============================================
        // Helper Functions for Piece Validation
        // ============================================
        function isWhitePiece(piece) {
            return piece === piece.toUpperCase() && piece !== '.';
        }

        function isBlackPiece(piece) {
            return piece === piece.toLowerCase() && piece !== '.';
        }

        function getPieceColor(piece) {
            if (piece === '.') return null;
            return isWhitePiece(piece) ? 'white' : 'black';
        }

        // ============================================
        // Convert coordinates to algebraic notation
        // ============================================
        function coordsToAlgebraic(row, col) {
            const files = 'abcdefgh';
            const ranks = '87654321';
            return files[col] + ranks[row];
        }

        // ============================================
        // Handle Square Click
        // ============================================
        async function handleSquareClick(row, col) {
            // Ignore clicks while engine is thinking
            if (isProcessing) {
                return;
            }

            const piece = board[row][col];
            const engineColor = document.getElementById('engineColor').value;
            const isEngineWhite = engineColor === 'white';
            const isUserTurn = (whiteToMove && !isEngineWhite) || (!whiteToMove && isEngineWhite);

            // If no piece is selected
            if (selectedSquare === null) {
                // User can only select their own pieces on their turn
                if (piece === '.' || !isUserTurn) {
                    return;
                }

                const pieceColor = getPieceColor(piece);
                const expectedColor = whiteToMove ? 'white' : 'black';

                if (pieceColor === expectedColor) {
                    // Select this piece and fetch legal moves
                    selectedSquare = { row, col };
                    showStatus('Fetching legal moves...', 'thinking');

                    // Fetch legal moves if not cached
                    if (!cachedLegalMoves) {
                        try {
                            cachedLegalMoves = await getLegalMoves();
                        } catch (error) {
                            console.error('Error fetching legal moves:', error);
                            showStatus('Error fetching legal moves', 'error');
                            setTimeout(hideStatus, 2000);
                            selectedSquare = null;
                            renderBoard();
                            return;
                        }
                    }

                    // Filter moves for this piece
                    const fromSquare = coordsToAlgebraic(row, col);
                    legalMovesForPiece = cachedLegalMoves.filter(move => move.startsWith(fromSquare));

                    hideStatus();
                    renderBoard();
                }
            } else {
                // A piece is already selected
                const fromRow = selectedSquare.row;
                const fromCol = selectedSquare.col;

                // If clicking the same square, deselect
                if (fromRow === row && fromCol === col) {
                    selectedSquare = null;
                    legalMovesForPiece = [];
                    renderBoard();
                    return;
                }

                // If clicking another piece of the same color, switch selection
                const selectedPiece = board[fromRow][fromCol];
                const selectedColor = getPieceColor(selectedPiece);
                const clickedColor = getPieceColor(piece);

                if (clickedColor === selectedColor) {
                    selectedSquare = { row, col };
                    // Filter moves for the new piece
                    const fromSquare = coordsToAlgebraic(row, col);
                    legalMovesForPiece = cachedLegalMoves.filter(move => move.startsWith(fromSquare));
                    renderBoard();
                    return;
                }

                // Try to make the move
                const moveStr = coordsToAlgebraic(fromRow, fromCol) + coordsToAlgebraic(row, col);
                attemptUserMove(moveStr);
            }
        }

        // ============================================
        // Get Legal Moves from API
        // ============================================
        async function getLegalMoves() {
            try {
                const fen = boardToFEN();
                const encodedFEN = encodeURIComponent(fen);
                const response = await fetch(`${LEGAL_MOVES_ENDPOINT}?fen=${encodedFEN}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'ok' && data.moves) {
                    return data.moves;
                } else if (data.status === 'error') {
                    throw new Error(data.message || 'Failed to get legal moves');
                } else {
                    throw new Error('Invalid response from server');
                }
            } catch (error) {
                console.error('Error in getLegalMoves:', error);
                throw error;
            }
        }

        // ============================================
        // Attempt User Move
        // ============================================
        function attemptUserMove(moveStr) {
            // Check if this is a promotion move BEFORE checking if it's legal
            // Promotion moves need special handling
            if (isPromotionMove(moveStr)) {
                // Show promotion modal instead of making the move
                showPromotionModal(moveStr);
                return;
            }

            // Validate move is legal
            if (!legalMovesForPiece.includes(moveStr)) {
                showStatus('Illegal move!', 'error');
                setTimeout(hideStatus, 2000);
                selectedSquare = null;
                legalMovesForPiece = [];
                renderBoard();
                return;
            }

            // Make the move IMMEDIATELY for instant visual feedback
            if (makeMove(moveStr)) {
                // Update display instantly
                updateLastMoveDisplay(moveStr);
                selectedSquare = null;
                legalMovesForPiece = [];
                cachedLegalMoves = null; // Clear cache for new position
                renderBoard();

                // Check if Learn Mode is active and engine should respond
                const engineColor = document.getElementById('engineColor').value;
                const isEngineWhite = engineColor === 'white';
                const engineShouldRespond = (whiteToMove === isEngineWhite);

                if (isLearnMode && engineShouldRespond) {
                    // In Learn Mode: check if we should ask for a move
                    checkIfEngineShouldAskForMove();
                } else {
                    // Normal mode: trigger engine move automatically
                    // This runs in the background without blocking
                    getEngineMove(true);
                }
            } else {
                // Invalid move format (shouldn't happen if validation passed)
                selectedSquare = null;
                legalMovesForPiece = [];
                renderBoard();
                showStatus('Invalid move format!', 'error');
                setTimeout(hideStatus, 2000);
            }
        }

        // ============================================
        // Convert Board State to FEN String
        // ============================================
        function boardToFEN() {
            let fen = '';

            // Board position
            for (let row = 0; row < 8; row++) {
                let emptyCount = 0;
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece === '.') {
                        emptyCount++;
                    } else {
                        if (emptyCount > 0) {
                            fen += emptyCount;
                            emptyCount = 0;
                        }
                        fen += piece;
                    }
                }
                if (emptyCount > 0) {
                    fen += emptyCount;
                }
                if (row < 7) {
                    fen += '/';
                }
            }

            // Active color
            fen += whiteToMove ? ' w' : ' b';

            // Castling rights (simplified - always assume all castling available at start)
            fen += ' KQkq';

            // En passant target square (parse from lastMove)
            if (lastMove && lastMove.length === 4) {
                const fromRow = 8 - parseInt(lastMove[1]);
                const toRow = 8 - parseInt(lastMove[3]);
                const fromCol = lastMove.charCodeAt(0) - 'a'.charCodeAt(0);
                const toCol = lastMove.charCodeAt(2) - 'a'.charCodeAt(0);
                const piece = board[toRow][toCol];

                // Check if last move was a 2-square pawn advance
                if ((piece === 'P' || piece === 'p') && Math.abs(toRow - fromRow) === 2 && fromCol === toCol) {
                    // This creates an en passant opportunity
                    const targetRow = Math.floor((fromRow + toRow) / 2);
                    const files = 'abcdefgh';
                    const ranks = '87654321';
                    fen += ' ' + files[toCol] + ranks[targetRow];
                } else {
                    fen += ' -';
                }
            } else {
                fen += ' -';
            }

            // Halfmove clock (simplified)
            fen += ' 0';

            // Fullmove number (simplified)
            fen += ' 1';

            return fen;
        }

        // ============================================
        // Parse Move String and Update Board
        // ============================================
        function makeMove(moveStr) {
            // Move format: "e2e4" (from square to square) or "e7e8q" (promotion)
            if (moveStr.length !== 4 && moveStr.length !== 5) {
                console.error('Invalid move format:', moveStr);
                return false;
            }

            const fromCol = moveStr.charCodeAt(0) - 'a'.charCodeAt(0);
            const fromRow = 8 - parseInt(moveStr[1]);
            const toCol = moveStr.charCodeAt(2) - 'a'.charCodeAt(0);
            const toRow = 8 - parseInt(moveStr[3]);

            // Validate coordinates
            if (fromRow < 0 || fromRow > 7 || fromCol < 0 || fromCol > 7 ||
                toRow < 0 || toRow > 7 || toCol < 0 || toCol > 7) {
                console.error('Invalid move coordinates:', moveStr);
                return false;
            }

            // Move the piece
            const piece = board[fromRow][fromCol];
            let pieceToPlace = piece;

            // Handle pawn promotion
            if (moveStr.length === 5) {
                const promotionPiece = moveStr[4];  // q, r, b, or n
                // Convert to correct case (uppercase for white, lowercase for black)
                const isWhite = (piece === 'P');
                pieceToPlace = isWhite ? promotionPiece.toUpperCase() : promotionPiece.toLowerCase();
                console.log('PROMOTION! Pawn promoted to:', pieceToPlace);
            }

            // Handle en passant capture
            if ((piece === 'P' || piece === 'p') && toCol !== fromCol && board[toRow][toCol] === '.') {
                // Pawn moved diagonally to empty square = en passant!
                console.log('EN PASSANT CAPTURE DETECTED in JavaScript makeMove()!');

                // The captured pawn is on the same rank as the moving pawn, in the destination column
                const capturedPawnRow = fromRow;
                const capturedPawnCol = toCol;

                console.log('  Capturing pawn at (' + capturedPawnRow + ',' + capturedPawnCol + ')');
                console.log('  Moving pawn to (' + toRow + ',' + toCol + ')');

                // Remove the captured pawn
                board[capturedPawnRow][capturedPawnCol] = '.';
            }

            board[toRow][toCol] = pieceToPlace;
            board[fromRow][fromCol] = '.';

            // Handle castling rook movement
            // Check if this was a castling move (king moved 2 squares horizontally)
            if ((piece === 'K' || piece === 'k') && Math.abs(toCol - fromCol) === 2) {
                console.log('CASTLING DETECTED in JavaScript makeMove()!');
                console.log('  Move:', moveStr);
                console.log('  King from: (' + fromRow + ',' + fromCol + ') to (' + toRow + ',' + toCol + ')');

                // Kingside castle (king moved to g-file, column 6)
                if (toCol === 6) {
                    // Move rook from h-file (7) to f-file (5)
                    console.log('  Kingside castle: Moving rook from (' + fromRow + ',7) to (' + fromRow + ',5)');
                    const rook = board[fromRow][7];
                    console.log('  Rook piece before move:', rook);
                    board[fromRow][5] = rook;
                    board[fromRow][7] = '.';
                    console.log('  Rook piece after move at (5):', board[fromRow][5]);
                }
                // Queenside castle (king moved to c-file, column 2)
                else if (toCol === 2) {
                    // Move rook from a-file (0) to d-file (3)
                    console.log('  Queenside castle: Moving rook from (' + fromRow + ',0) to (' + fromRow + ',3)');
                    const rook = board[fromRow][0];
                    console.log('  Rook piece before move:', rook);
                    board[fromRow][3] = rook;
                    board[fromRow][0] = '.';
                    console.log('  Rook piece after move at (3):', board[fromRow][3]);
                }
            }

            // Update game state
            whiteToMove = !whiteToMove;
            lastMove = moveStr;

            return true;
        }

        // Helper function to check if a move is a promotion
        function isPromotionMove(moveStr) {
            if (moveStr.length !== 4) return false;

            const fromCol = moveStr.charCodeAt(0) - 'a'.charCodeAt(0);
            const fromRow = 8 - parseInt(moveStr[1]);
            const toRow = 8 - parseInt(moveStr[3]);

            // Check if it's a pawn moving to the back rank
            if (piece === 'P' && toRow === 0) return true;  // White promotion

                const response = await fetch(`${API_ENDPOINT}?fen=${encodedFEN}`);

                const data = await response.json();

                if (data.status === 'ok' && data.move) {

        // Convert algebraic notation (e.g., "pc6", "Nf3", "short castle") to internal format (e.g., "c7c6")
        async function convertAlgebraicToInternal(algebraicMove) {
            try {
                // Get legal moves for current position
                if (!cachedLegalMoves) {
                    cachedLegalMoves = await getLegalMoves();
                }

                const move = algebraicMove.trim();

                // Log for debugging
                console.log('Parsing move notation:', move);
                console.log('Legal moves available:', cachedLegalMoves);

                // ========================================
                // RULE 1: Check for exact match first
                // ========================================
                if (cachedLegalMoves.includes(move)) {
                    console.log('Exact match found:', move);
                    return move;
                }

                // ========================================
                // RULE 2: Handle CASTLING
                // ========================================
                const lowerMove = move.toLowerCase();

                if (lowerMove === 'short castle') {
                    // Kingside castling - find e1g1 or e8g8
                    const castleMove = cachedLegalMoves.find(m =>
                        m === 'e1g1' || m === 'e8g8'
                    );
                    if (castleMove) {
                        console.log('Short castle matched:', castleMove);
                        return castleMove;
                    }
                }

                if (lowerMove === 'long castle') {
                    // Queenside castling - find e1c1 or e8c8
                    const castleMove = cachedLegalMoves.find(m =>
                        m === 'e1c1' || m === 'e8c8'
                    );
                    if (castleMove) {
                        console.log('Long castle matched:', castleMove);
                        return castleMove;
                    }
                }

                // ========================================
                // RULE 3: Handle CAPTURES
                // Format: "pd5 takes pe4"
                // ========================================
                if (move.toLowerCase().includes(' takes ')) {
                    const parts = move.split(/\s+takes\s+/i);
                    if (parts.length === 2) {
                        const attacker = parts[0].trim();  // e.g., "pd5" or "Nf3"
                        const victim = parts[1].trim();     // e.g., "pe4" or "rd8"

                        // Validate format: piece + square (both parts)
                        const attackerMatch = attacker.match(/^([pnbrqk])([a-h][1-8])$/i);
                        const victimMatch = victim.match(/^([pnbrqk])([a-h][1-8])$/i);

                        if (attackerMatch && victimMatch) {
                            const fromSquare = attackerMatch[2].toLowerCase();
                            const toSquare = victimMatch[2].toLowerCase();

                            // Validate squares are lowercase
                            if (attackerMatch[2] !== fromSquare || victimMatch[2] !== toSquare) {
                                console.error('Invalid capture: squares must be lowercase');
                                return null;
                            }

                            // Build move string: from + to (e.g., "d5e4")
                            const captureMove = fromSquare + toSquare;

                            // Check if this move exists in legal moves
                            if (cachedLegalMoves.includes(captureMove)) {
                                console.log('Capture move matched:', captureMove);
                                return captureMove;
                            }
                        }
                    }
                }

                // ========================================
                // RULE 4: Handle STANDARD PIECE MOVES
                // Format: [Piece][square] (e.g., "pc6", "Nf3")
                // ========================================
                const pieceMatch = move.match(/^([pnbrqk])([a-h][1-8])$/i);

                if (pieceMatch) {
                    const pieceLetter = pieceMatch[1].toLowerCase();
                    const targetSquare = pieceMatch[2];

                    // Validate square is lowercase
                    if (targetSquare !== targetSquare.toLowerCase()) {
                        console.error('Invalid notation: square must be lowercase');
                        return null;
                    }

                    console.log('Looking for piece move:', pieceLetter, 'to', targetSquare);

                    // Map piece letters to internal representations
                    const pieceMap = {
                        'p': 'pawn',
                        'n': 'knight',
                        'b': 'bishop',
                        'r': 'rook',
                        'q': 'queen',
                        'k': 'king'
                    };

                    // Find all moves that end with the target square
                    const candidateMoves = cachedLegalMoves.filter(m => m.endsWith(targetSquare));
                    console.log('Candidate moves ending with', targetSquare + ':', candidateMoves);

                    // For pawns: match moves that are 4 characters (simple pawn moves like "e2e4")
                    if (pieceLetter === 'p') {
                        const pawnMove = candidateMoves.find(m => m.length === 4);
                        if (pawnMove) {
                            console.log('Pawn move matched:', pawnMove);
                            return pawnMove;
                        }
                    }

                    // For other pieces: typically 4 characters too, but we need better logic
                    // For now, return the first candidate if only one exists
                    if (candidateMoves.length === 1) {
                        console.log('Single candidate move matched:', candidateMoves[0]);
                        return candidateMoves[0];
                    }

                    // If multiple candidates, we need disambiguation (future enhancement)
                    if (candidateMoves.length > 1) {
                        console.warn('Multiple moves possible to', targetSquare + '. Need disambiguation.');
                        console.warn('Candidates:', candidateMoves);
                        // For now, return the first one
                        return candidateMoves[0];
                    }
                }

                // ========================================
                // RULE 5: No match found
                // ========================================
                console.error('Could not parse move notation:', move);
                console.error('Legal moves:', cachedLegalMoves);
                return null;

            } catch (error) {
                console.error('Error converting move:', error);
                return null;
            }
        }

        // Validate move notation format before processing
        function validateMoveNotation(move) {
            const errors = [];

            // Check for castling
            const lowerMove = move.toLowerCase();
            if (lowerMove === 'short castle' || lowerMove === 'long castle') {
                return { valid: true, errors: [] };
            }

            // Check for capture notation
            if (move.toLowerCase().includes(' takes ')) {
                const parts = move.split(/\s+takes\s+/i);
                if (parts.length !== 2) {
                    errors.push('Capture format should be: [piece][square] takes [piece][square]');
                    return { valid: false, errors };
                }

                for (const part of parts) {
                    const match = part.trim().match(/^([pnbrqk])([a-h][1-8])$/i);
                    if (!match) {
                        errors.push(`Invalid format: ${part}. Should be piece + square (e.g., pd5, Nf3)`);
                    } else if (match[2] !== match[2].toLowerCase()) {
                        errors.push(`Square must be lowercase: ${match[2]} → ${match[2].toLowerCase()}`);
                    }
                }

                return { valid: errors.length === 0, errors };
            }

            // Check for standard piece move
            const match = move.match(/^([pnbrqk])([a-h][1-8])$/i);
            if (!match) {
                errors.push('Format should be: [piece][square] (e.g., pc6, Nf3, ke2)');
                return { valid: false, errors };
            }

            if (match[2] !== match[2].toLowerCase()) {
                errors.push(`Square must be lowercase: ${match[2]} → ${match[2].toLowerCase()}`);
                return { valid: false, errors };
            }

            return { valid: true, errors: [] };
        }

        // Check if engine should ask for a move
        async function checkIfEngineShouldAskForMove() {
            try {
                // Get current board state
                const fen = boardToFEN();
                const opening = document.getElementById('openingSelect').value;

                console.log('Checking if engine knows position:', fen);

                // Show thinking status
                setEngineThinking();

                // Call get endpoint
                const encodedFEN = encodeURIComponent(fen);
                const response = await fetch(
                    `${API_ENDPOINT.replace('/move', '')}/get-opening-move?opening=${opening}&fen=${encodedFEN}`
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'ok') {
                    if (data.found && data.move) {
                        // Position found in opening book!
                        console.log('Position found in opening book! Move:', data.move);

                        // Convert the move to internal format
                        const convertedMove = await convertAlgebraicToInternal(data.move);

                        if (convertedMove) {
                            // Make the move automatically
                            console.log('Auto-playing learned move:', convertedMove);

                            if (makeMove(convertedMove)) {
                                updateLastMoveDisplay(convertedMove);
                                cachedLegalMoves = null;
                                renderBoard();
                                setEngineIdle();
                                console.log('Successfully played learned move');
                            } else {
                                throw new Error('Failed to make the learned move on board');
                            }
                        } else {
                            throw new Error('Could not convert learned move: ' + data.move);
                        }
                    } else {
                        // Position NOT in opening book - ask user to teach it
                        console.log('Position not in opening book - showing teach modal');
                        setEngineIdle();
                        showMoveInputModal();
                    }
                } else {
                    throw new Error(data.message || 'Failed to check opening book');
                }
            } catch (error) {
                console.error('Error checking opening book:', error);
                setEngineIdle();
                showStatus('Error checking opening book: ' + error.message, 'error');
                setTimeout(hideStatus, 5000);

                // Fall back to showing the modal so user can still teach
                showMoveInputModal();
            }
        }

        // ============================================
        // Initialize on Page Load
        // ============================================
        window.onload = function() {
            initializeBoard();
            renderBoard();
            console.log('Chess board initialized!');
            console.log('API Endpoint:', API_ENDPOINT);

            // Wire up Learn Mode button
            const learnModeBtn = document.getElementById('learnModeBtn');
            learnModeBtn.addEventListener('click', toggleLearnMode);

            // Wire up Move Input Modal buttons
            const teachMoveBtn = document.getElementById('teachMoveBtn');
            const cancelMoveBtn = document.getElementById('cancelMoveBtn');

            teachMoveBtn.addEventListener('click', handleTeachMove);
            cancelMoveBtn.addEventListener('click', hideMoveInputModal);

            // Wire up Enter key support in move input field
            const moveInput = document.getElementById('moveInput');
            moveInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleTeachMove();
                }
            });

            console.log('Learn Mode event handlers initialized');
        };
    </script>
</body>
