        // Convert internal format (e.g., "c7c6") to algebraic notation (e.g., "pc6")
        async function convertInternalToAlgebraic(internalMove) {
            try {
                // For now, we'll use a simple conversion
                // The API accepts moves in the format that convertAlgebraicToInternal produces
                // So we need to reverse that process

                if (internalMove.length < 4) {
                    console.error('Invalid internal move format:', internalMove);
                    return internalMove;
                }

                const fromSquare = internalMove.substring(0, 2);
                const toSquare = internalMove.substring(2, 4);
                const promotion = internalMove.length === 5 ? internalMove[4] : null;

                // Get the piece at the from square (before the move was made, we need to look at current board)
                // Actually, the move has already been made, so we need to look at the destination
                const toCol = toSquare.charCodeAt(0) - 'a'.charCodeAt(0);
                const toRow = 8 - parseInt(toSquare[1]);
                const piece = board[toRow][toCol];

                if (piece === '.') {
                    console.error('No piece at destination square');
                    return internalMove;
                }

                // Map piece to letter
                const pieceMap = {
                    'p': 'p', 'P': 'p',
                    'n': 'n', 'N': 'n',
                    'b': 'b', 'B': 'b',
                    'r': 'r', 'R': 'r',
                    'q': 'q', 'Q': 'q',
                    'k': 'k', 'K': 'k'
                };

                const pieceLetter = pieceMap[piece] || 'p';

                // Format: piece + destination square (e.g., "pc6", "Nf3")
                const algebraic = pieceLetter + toSquare;

                console.log('Converted', internalMove, 'to', algebraic);
                return algebraic;
            } catch (error) {
                console.error('Error converting internal to algebraic:', error);
                return internalMove; // Return original if conversion fails
            }
        }

        // Convert algebraic notation (e.g., "pc6", "Nf3", "short castle") to internal format (e.g., "c7c6")
        async function convertAlgebraicToInternal(algebraicMove) {
            try {
                // Get legal moves for current position
                if (!cachedLegalMoves) {
                    cachedLegalMoves = await getLegalMoves();
                }

                const move = algebraicMove.trim();

                // Log for debugging
                console.log('Parsing move notation:', move);
                console.log('Legal moves available:', cachedLegalMoves);

                // ========================================
                // RULE 1: Check for exact match first
                // ========================================
                if (cachedLegalMoves.includes(move)) {
                    console.log('Exact match found:', move);
                    return move;
                }

                // ========================================
                // RULE 2: Handle CASTLING
                // ========================================
                const lowerMove = move.toLowerCase();

                if (lowerMove === 'short castle') {
                    // Kingside castling - find e1g1 or e8g8
                    const castleMove = cachedLegalMoves.find(m =>
                        m === 'e1g1' || m === 'e8g8'
                    );
                    if (castleMove) {
                        console.log('Short castle matched:', castleMove);
                        return castleMove;
                    }
                }

                if (lowerMove === 'long castle') {
                    // Queenside castling - find e1c1 or e8c8
                    const castleMove = cachedLegalMoves.find(m =>
                        m === 'e1c1' || m === 'e8c8'
                    );
                    if (castleMove) {
                        console.log('Long castle matched:', castleMove);
                        return castleMove;
                    }
                }

                // ========================================
                // RULE 3: Handle CAPTURES
                // Format: "pd5 takes pe4"
                // ========================================
                if (move.toLowerCase().includes(' takes ')) {
                    const parts = move.split(/\s+takes\s+/i);
                    if (parts.length === 2) {
                        const attacker = parts[0].trim();  // e.g., "pd5" or "Nf3"
                        const victim = parts[1].trim();     // e.g., "pe4" or "rd8"

                        // Validate format: piece + square (both parts)
                        const attackerMatch = attacker.match(/^([pnbrqk])([a-h][1-8])$/i);
                        const victimMatch = victim.match(/^([pnbrqk])([a-h][1-8])$/i);

                        if (attackerMatch && victimMatch) {
                            const fromSquare = attackerMatch[2].toLowerCase();
                            const toSquare = victimMatch[2].toLowerCase();

                            // Validate squares are lowercase
                            if (attackerMatch[2] !== fromSquare || victimMatch[2] !== toSquare) {
                                console.error('Invalid capture: squares must be lowercase');
                                return null;
                            }

                            // Build move string: from + to (e.g., "d5e4")
                            const captureMove = fromSquare + toSquare;

                            // Check if this move exists in legal moves
                            if (cachedLegalMoves.includes(captureMove)) {
                                console.log('Capture move matched:', captureMove);
                                return captureMove;
                            }
                        }
                    }
                }

                // ========================================
                // RULE 4: Handle STANDARD PIECE MOVES
                // Format: [Piece][square] (e.g., "pc6", "Nf3")
                // ========================================
                const pieceMatch = move.match(/^([pnbrqk])([a-h][1-8])$/i);

                if (pieceMatch) {
                    const pieceLetter = pieceMatch[1].toLowerCase();
                    const targetSquare = pieceMatch[2];

                    // Validate square is lowercase
                    if (targetSquare !== targetSquare.toLowerCase()) {
                        console.error('Invalid notation: square must be lowercase');
                        return null;
                    }

                    console.log('Looking for piece move:', pieceLetter, 'to', targetSquare);

                    // Map piece letters to internal representations
                    const pieceMap = {
                        'p': 'pawn',
                        'n': 'knight',
                        'b': 'bishop',
                        'r': 'rook',
                        'q': 'queen',
                        'k': 'king'
                    };

                    // Find all moves that end with the target square
                    const candidateMoves = cachedLegalMoves.filter(m => m.endsWith(targetSquare));
                    console.log('Candidate moves ending with', targetSquare + ':', candidateMoves);

                    // For PAWNS: filter out knight starting squares
                    if (pieceLetter === 'p') {
                        const pawnMove = candidateMoves.find(m => {
                            if (m.length !== 4) return false;
                            const fromSquare = m.substring(0, 2);
                            // Knights start on b and g files, rank 1 or 8
                            const isKnightSquare = (fromSquare[0] === 'b' || fromSquare[0] === 'g') &&
                                                   (fromSquare[1] === '1' || fromSquare[1] === '8');
                            const isValidPawn = !isKnightSquare;
                            if (!isValidPawn) {
                                console.log('Rejecting', m, '- starts from knight square');
                            }
                            return isValidPawn;  // Return true if NOT a knight square
                        });

                        if (pawnMove) {
                            console.log('Pawn move matched:', pawnMove);
                            return pawnMove;
                        }
                    }

                    // For KNIGHTS: specifically match knight moves
                    if (pieceLetter === 'n') {
                        const knightMove = candidateMoves.find(m => {
                            if (m.length !== 4) return false;
                            const fromSquare = m.substring(0, 2);
                            const fromFile = fromSquare[0];
                            const toFile = targetSquare[0];
                            const fromRank = parseInt(fromSquare[1]);
                            const toRank = parseInt(targetSquare[1]);

                            const fileDiff = Math.abs(fromFile.charCodeAt(0) - toFile.charCodeAt(0));
                            const rankDiff = Math.abs(fromRank - toRank);

                            // Knight moves: (2,1) or (1,2) in file and rank
                            const isKnightMove = (fileDiff === 2 && rankDiff === 1) || (fileDiff === 1 && rankDiff === 2);

                            if (isKnightMove) {
                                console.log('Valid knight move:', m);
                                return true;
                            }

                            return false;
                        });

                        if (knightMove) {
                            console.log('Knight move matched:', knightMove);
                            return knightMove;
                        }
                    }

                    // For other pieces: return the first candidate if only one exists
                    if (candidateMoves.length === 1) {
                        console.log('Single candidate move matched:', candidateMoves[0]);
                        return candidateMoves[0];
                    }

                    // If multiple candidates, we need disambiguation (future enhancement)
                    if (candidateMoves.length > 1) {
                        console.warn('Multiple moves possible to', targetSquare + '. Need disambiguation.');
                        console.warn('Candidates:', candidateMoves);
                        // For now, return the first one
                        return candidateMoves[0];
                    }
                }

                // ========================================
                // RULE 5: No match found
                // ========================================
                console.error('Could not parse move notation:', move);
                console.error('Legal moves:', cachedLegalMoves);
                return null;

            } catch (error) {
                console.error('Error converting move:', error);
                return null;
            }
        }

        // Validate move notation format before processing
        function validateMoveNotation(move) {
            const errors = [];

            // Check for castling
            const lowerMove = move.toLowerCase();
            if (lowerMove === 'short castle' || lowerMove === 'long castle') {
                return { valid: true, errors: [] };
            }

            // Check for capture notation
            if (move.toLowerCase().includes(' takes ')) {
                const parts = move.split(/\s+takes\s+/i);
                if (parts.length !== 2) {
                    errors.push('Capture format should be: [piece][square] takes [piece][square]');
                    return { valid: false, errors };
                }

                for (const part of parts) {
                    const match = part.trim().match(/^([pnbrqk])([a-h][1-8])$/i);
                    if (!match) {
                        errors.push(`Invalid format: ${part}. Should be piece + square (e.g., pd5, Nf3)`);
                    } else if (match[2] !== match[2].toLowerCase()) {
                        errors.push(`Square must be lowercase: ${match[2]} → ${match[2].toLowerCase()}`);
                    }
                }

                return { valid: errors.length === 0, errors };
            }

            // Check for standard piece move
            const match = move.match(/^([pnbrqk])([a-h][1-8])$/i);
            if (!match) {
                errors.push('Format should be: [piece][square] (e.g., pc6, Nf3, ke2)');
                return { valid: false, errors };
            }

            if (match[2] !== match[2].toLowerCase()) {
                errors.push(`Square must be lowercase: ${match[2]} → ${match[2].toLowerCase()}`);
                return { valid: false, errors };
            }

            return { valid: true, errors: [] };
        }

        // Load board state from FEN string
        function loadBoardFromFEN(fen) {
            console.log('Loading board from FEN:', fen);

            const parts = fen.split(' ');
            const position = parts[0];

            // Clear the board (2D array)
            board = [];
            for (let row = 0; row < 8; row++) {
                board[row] = [];
                for (let col = 0; col < 8; col++) {
                    board[row][col] = '.';
                }
            }

            // Parse piece positions
            let row = 0; // Start from rank 8 (row 0)
            let col = 0;

            for (let char of position) {
                if (char === '/') {
                    row++;
                    col = 0;
                } else if (char >= '1' && char <= '8') {
                    // Empty squares - skip ahead
                    col += parseInt(char);
                } else {
                    // Piece - directly use the FEN character
                    board[row][col] = char;
                    col++;
                }
            }

            // Update turn
            whiteToMove = (parts[1] === 'w');

            console.log('Board loaded. White to move:', whiteToMove);
        }

        // Convert FEN character to piece (no conversion needed - FEN uses same format)
        function charToPiece(char) {
            // Board uses same representation as FEN:
            // White: K, Q, R, B, N, P (uppercase)
            // Black: k, q, r, b, n, p (lowercase)
            // Empty: '.'
            return char;
        }

        // Check if engine should ask for a move
        async function checkIfEngineShouldAskForMove() {
            try {
                // Get current board state
                const fen = boardToFEN();
                const opening = document.getElementById('openingSelect').value;

                console.log('Checking if engine knows position:', fen);

                // Show thinking status
                showStatus('Checking opening book...', 'thinking');

                // Call get endpoint
                const encodedFEN = encodeURIComponent(fen);
                const response = await fetch(
                    `${API_ENDPOINT.replace('/move', '')}/get-opening-move?opening=${opening}&fen=${encodedFEN}`
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'ok') {
                    if (data.found && data.move) {
                        // Position found in opening book!
                        console.log('Position found in opening book! Move:', data.move);

                        // Capture FEN before engine moves
                        lastEngineFEN = boardToFEN();

                        // Convert the move to internal format
                        const convertedMove = await convertAlgebraicToInternal(data.move);

                        if (convertedMove) {
                            // Make the move automatically
                            console.log('Auto-playing learned move:', convertedMove);

                            if (makeMove(convertedMove)) {
                                // Capture the move that was made
                                lastEngineMove = convertedMove;

                                // Record learned engine move in history
                                const moveRecord = {
                                    from: convertedMove.substring(0, 2),
                                    to: convertedMove.substring(2, 4),
                                    notation: convertedMove,
                                    fen: boardToFEN(),
                                    timestamp: Date.now(),
                                    wasWhiteMove: !whiteToMove,
                                    isEngineMove: true,
                                    isLearnedMove: true
                                };

                                moveHistory.push(moveRecord);
                                currentMoveIndex = moveHistory.length - 1;
                                isViewingHistory = false;

                                console.log('Learned engine move recorded in history. Total moves:', moveHistory.length);

                                // Update navigation buttons
                                updateNavigationButtons();

                                updateLastMoveDisplay(convertedMove);
                                cachedLegalMoves = null;
                                renderBoard();
                                hideStatus();

                                // Show the "Forget Move" button
                                const forgetBtn = document.getElementById('forgetMoveBtn');
                                forgetBtn.style.display = 'inline-block';

                                console.log('✅ FORGET MOVE BUTTON SHOWN');
                                console.log('Button element:', forgetBtn);
                                console.log('Button display style:', forgetBtn.style.display);
                                console.log('Button computed display:', window.getComputedStyle(forgetBtn).display);
                                console.log('Successfully played learned move');
                                console.log('Last engine move captured:', lastEngineMove);
                                console.log('FEN before move:', lastEngineFEN);
                            } else {
                                throw new Error('Failed to make the learned move on board');
                            }
                        } else {
                            throw new Error('Could not convert learned move: ' + data.move);
                        }
                    } else {
                        // Position NOT in opening book - enable visual teaching mode
                        console.log('Position not in opening book - enabling visual teaching');

                        // Capture the FEN of the position being taught
                        teachingFEN = boardToFEN();
                        console.log('Teaching FEN:', teachingFEN);

                        // Show teaching status
                        showStatus('Unknown position! Move the engine\'s piece yourself.', 'teaching');

                        // Enable teaching mode flag
                        isTeachingMove = true;

                        // Highlight that we're in teaching mode
                        document.body.classList.add('teaching-mode');

                        // Hide forget button during teaching
                        document.getElementById('forgetMoveBtn').style.display = 'none';

                        console.log('✅ Teaching mode enabled - you can now move engine pieces');
                    }
                } else {
                    throw new Error(data.message || 'Failed to check opening book');
                }
            } catch (error) {
                console.error('Error checking opening book:', error);
                showStatus('Error checking opening book: ' + error.message, 'error');
                setTimeout(hideStatus, 5000);

                // Fall back to visual teaching mode
                teachingFEN = boardToFEN();
                isTeachingMove = true;
                document.body.classList.add('teaching-mode');
                console.log('Enabled teaching mode after error');
            }
        }

        // ============================================
        // Initialize on Page Load
        // ============================================
        window.onload = function() {
            initializeBoard();
            renderBoard();
            console.log('Chess board initialized!');
            console.log('API Endpoint:', API_ENDPOINT);

            // Wire up Learn Mode button
            const learnModeBtn = document.getElementById('learnModeBtn');
            learnModeBtn.addEventListener('click', toggleLearnMode);

            // Wire up Move Input Modal buttons
            const teachMoveBtn = document.getElementById('teachMoveBtn');
            const cancelMoveBtn = document.getElementById('cancelMoveBtn');

            teachMoveBtn.addEventListener('click', handleTeachMove);
            cancelMoveBtn.addEventListener('click', hideMoveInputModal);

            // Wire up Enter key support in move input field
            const moveInput = document.getElementById('moveInput');
            moveInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleTeachMove();
                }
            });

            console.log('Learn Mode event handlers initialized');

            // Add document-level drag-and-drop event listeners
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);

            console.log('Drag-and-drop event handlers initialized');

            // Keyboard shortcuts for move navigation
            document.addEventListener('keydown', function(event) {
                // Only handle if not typing in an input field
                if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                    return;
                }

                // Left arrow - go back
                if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    goBackOneMove();
                }
                // Right arrow - go forward
                else if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    goForwardOneMove();
                }
                // Home - go to start
                else if (event.key === 'Home') {
                    event.preventDefault();
                    currentMoveIndex = -1;
                    isViewingHistory = true;
                    loadStartingPosition();
                    updateNavigationButtons();
                    document.body.classList.add('viewing-history');
                }
                // End - go to current
                else if (event.key === 'End') {
                    event.preventDefault();
                    goToCurrentPosition();
                }
            });

            console.log('Keyboard shortcuts initialized');

            // Close settings menu when clicking outside
            document.addEventListener('click', function(event) {
                const settingsContainer = document.querySelector('.settings-container');
                const settingsBtn = document.getElementById('settingsBtn');

                if (settingsContainer && !settingsContainer.contains(event.target)) {
                    document.getElementById('settingsDropdown').style.display = 'none';
                }
            });

            console.log('Settings menu click-outside handler initialized');
        };
    </script>
